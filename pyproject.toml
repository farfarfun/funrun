[project]
name = "farrun"
version = "0.1.17"
description = "farrun"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [ "farlog>=1.1.7", "funshell>=1.0.19", "typer>=0.12",]
license = "MIT"
license-files = ["LICENSE"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.scripts]
farrun = "farrun.run:run_task"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.urls]
Organization = "https://github.com/farfarfun"
Homepage = "https://pypi.org/project/farrun/"
Repository = "https://github.com/farfarfun/farrun"
Releases = "https://github.com/farfarfun/farrun/releases"
[dependency-groups]
dev = [ "funbuild>=1.6.66", "pytest>=8.0.0",]

[tool.setuptools]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/farrun"]

[tool.ruff.lint]
ignore = [
    # farlog（基于 loguru）的日志调用用 `{}` 占位符传参，不是 stdlib logging 的
    # `%s` 语法；ruff 把 logger 调用当成 stdlib logging 处理，误判为参数过多。
    "PLE1205",
]
