[project]
name = "funrun"
version = "0.1.16"
description = "funrun"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [ "farlog>=1.1.7", "funshell>=1.0.19",]
license = "MIT"
license-files = ["LICENSE"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.scripts]
funrun = "funrun.run:run_task"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funrun"
Releases = "https://github.com/farfarfun/funrun/releases"
[dependency-groups]
dev = [ "funbuild>=1.6.66", "pytest>=8.0.0",]

[tool.setuptools]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funrun"]
